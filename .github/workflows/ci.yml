name: Aesthetix CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper (se houver)
        run: chmod +x mvnw || true

      - name: Compilar e executar testes
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw clean verify
          else
            mvn clean verify
          fi

      - name: Publicar relatório de testes (JUnit)
        uses: mikepenz/action-junit-report@v4
        if: always() # Executa mesmo se houver falha nos testes
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          require_tests: false