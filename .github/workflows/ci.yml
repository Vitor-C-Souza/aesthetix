name: Aesthetix CI (Build & Test)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw || true

      - name: Compilar e executar testes
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw clean package -B --no-transfer-progress
          else
            mvn clean package -B --no-transfer-progress
          fi

      - name: Publicar relatório de testes (JUnit)
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          require_tests: false

      # Salva o arquivo .jar compilado para o workflow de CD usar
      - name: Salvar Artefato (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1