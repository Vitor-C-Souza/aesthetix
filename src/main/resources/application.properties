# Nome da Aplicação
spring.application.name=aesthetix
# Banco de Dados MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aesthetix_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:aesthetix}
spring.datasource.password=${DB_PASSWORD:aesthetix_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# Porta da API
server.port=${PORT:8081}
# JWT
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToAStrongOneOfAtLeast32Bytes!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
# Springdoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs