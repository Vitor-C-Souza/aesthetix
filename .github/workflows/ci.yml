name: Aesthetix CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read
  checks: write

jobs:
  build-and-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper (se houver)
        run: chmod +x mvnw || true

      - name: Compilar e executar testes
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw clean package -B --no-transfer-progress
          else
            mvn clean package -B --no-transfer-progress
          fi

      - name: Publicar relatório de testes (JUnit)
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          require_tests: false

      # Executa o deploy no Azure apenas se for PUSH em main ou master (não roda em Pull Requests)
      - name: Deploy no Azure App Service
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-aesthetix-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'target/*.jar'